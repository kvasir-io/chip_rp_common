name: CI

# The host tests of the constexpr PIO assembler (tests/CMakeLists.txt): most checks are static_asserts, so building is
# the test. A lone checkout of this repository is all they need: pioasm (the oracle), cmake_helpers, pico-sdk and
# pico-examples (the .pio corpus) are fetched by the tests' CMakeLists. arm-none-eabi-gcc is installed so the gcc check
# covers the firmware compiler too.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        name: ${{ matrix.compiler.cc }}
        runs-on: ubuntu-latest
        container:
            image: archlinux:latest
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - {cc: gcc, cxx: g++}
                    - {cc: clang, cxx: clang++}

        steps:
            - name: Set up C++ environment
              run: |
                pacman -Syu --noconfirm --disable-download-timeout
                pacman -S --noconfirm --disable-download-timeout git cmake ninja base-devel python arm-none-eabi-gcc arm-none-eabi-newlib ${{ matrix.compiler.cc == 'clang' && 'clang' || '' }}

            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Configure CMake
              run: cmake -S tests -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
              env:
                CC: ${{ matrix.compiler.cc }}
                CXX: ${{ matrix.compiler.cxx }}

            - name: Build tests
              run: cmake --build build -j"$(nproc)"

            - name: Run tests
              run: ctest --test-dir build --output-on-failure
