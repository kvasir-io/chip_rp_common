name: CI

# The host tests (tests/CMakeLists.txt: the constexpr PIO assembler, PWM, pin functions, alias backend, PLL search): most
# checks are static_asserts, so building is the test. A lone checkout of this repository is all they need: Kvasir_SDK's
# headers (the alias and PLL tests) are fetched by the tests' CMakeLists. arm-none-eabi-gcc is installed so the gcc
# check covers the firmware compiler too.
# conformance-rp2040 / conformance-rp2350: the RP chips' conformance tree (tests/conformance), Kvasir_SDK
# package-conformance.yml, once per chip: it fetches the chip (master, its core submodule) and puts this checkout in as
# the chip's src/chip/rp_common, so the tree tests these headers with the chip as it is.

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
    workflow_dispatch:

jobs:
    test:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-host-tests.yml@master
        with: {extra-packages: python arm-none-eabi-gcc arm-none-eabi-newlib}

    conformance-rp2040:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-conformance.yml@master
        with: {cmake-args: -DCONFORMANCE_CHIP=rp2040}

    conformance-rp2350:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-conformance.yml@master
        with: {variants: '["RP2350A","RP2350B"]', cmake-args: -DCONFORMANCE_CHIP=rp2350}

    # the include layering of this repository against Kvasir_SDK tools/layers.toml (any finding fails)
    layers:
        uses: kvasir-io/Kvasir_SDK/.github/workflows/package-layers.yml@master
